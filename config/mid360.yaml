common:
    debug_mode: false
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    voxel_size: 0.2
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    # fov_degree:    360
    # det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]
surfel_map_config:
    voxel_size: 0.4
    search_radius: 0

surfel_config:
    growing_radius: 0.4
    min_mature_surfel_count: 8
    max_planarity_ratio: 0.10
    min_plane_spread_eigenvalue: 0.005
    association_covariance_eigenvalue_floor: 0.25
    max_mahalanobis_distance: 2.0
    # Association uses growing surfels with a maturity-scaled confidence, and
    # mature coplanar surfels are merged off the hot path within a fixed
    # budget per frame (map maintenance, not trajectory correction).
    growing_association_weight: 0.2
    merge_enabled: true
    # Deletion strategy (landed): merged-away surfels stay as cheap tombstones
    # and are physically removed by a periodic compaction pass. Measured on the
    # four dev bags: duplicate coplanar pairs -12%..-82%, p99 latency lower,
    # accuracy unchanged. Eager removal at merge time was tried and rejected
    # (upstairs ATE 0.0784 -> 0.0958, KA e2e 3.60 -> 3.91: removing absorbed
    # roots early also removes later merge opportunities). Deleting stale
    # growing fragments is disabled: it costs accuracy on the long outdoor bags.
    compaction_interval_frames: 256
    delete_growing_enabled: false
                   
# publish:
    # path_en:  false
    # scan_publish_en:  true       # false: close all the point cloud output
    # dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    # scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

# pcd_save:
    # pcd_save_en: true
    # interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

# Iterated-EKF solver: FAST-LIO style 1e-3 convergence threshold.
iekf:
    max_iterations: 10
    min_delta_norm: 1.0e-3
