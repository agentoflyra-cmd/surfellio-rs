common:
    debug_mode: false
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    voxel_size: 0.2
    lidar_type: 2                # 2 = Velodyne PointCloud2
    scan_line: 16
    blind: 2.0

mapping:
    acc_cov: 0.01256144599541998
    gyr_cov: 9.331396894090049e-05
    b_acc_cov: 0.0001286757133427232
    b_gyr_cov: 0.0001286757133427232
    extrinsic_est_en: false
    extrinsic_T: [-0.01907, 0.0045, 0.05714]
    extrinsic_R: [0.9992567134, 0.0323885370, -0.0209046257,
                  -0.0323328632, 0.9994726664, 0.0029958365,
                   0.0209906327, -0.0023177033, 0.9997769859]

surfel_map_config:
    voxel_size: 0.4
    search_radius: 0

surfel_config:
    growing_radius: 0.4
    min_mature_surfel_count: 8
    max_planarity_ratio: 0.10
    min_plane_spread_eigenvalue: 0.005
    association_covariance_eigenvalue_floor: 0.25
    max_mahalanobis_distance: 2.0
    growing_association_weight: 0.2
    merge_enabled: true
    # Same landed maintenance/deletion defaults as the indoor mid360 config.
    compaction_interval_frames: 256
    delete_growing_enabled: false
    merge_queue_limit: 4096
    maintenance_max_tasks: 32

# Iterated-EKF solver: FAST-LIO style 1e-3 convergence threshold.
iekf:
    max_iterations: 10
    min_delta_norm: 1.0e-3
    # Real-time performance switch: reuse the surfel associations computed by the
    # first IEKF iteration in the later iterations (residual/Jacobian are still
    # recomputed at the new pose; a point is re-queried when its cached plane
    # residual exceeds 0.10 m). Off by default: safe on data with a low
    # correspondence-change rate (~3-4%, e.g. Spires; frame time 81 -> 56 ms) but
    # degrades short indoor bags / long courses where the change rate is high
    # (yuanqu ~16%, KA e2e 3.54 -> 4.59 m). See docs/performance.md.
    assoc_reuse: false
